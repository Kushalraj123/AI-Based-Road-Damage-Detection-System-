services:
  - type: web
    name: road-damage-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt && python -c "from huggingface_hub import hf_hub_download; hf_hub_download('ozair23/yolov8-road-damage-detector', 'best.pt'); hf_hub_download('vinothvikas1987/pothole-detection-yolov8', 'best.pt')"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: road_damage_db
      - key: CORS_ORIGINS
        value: "*"
